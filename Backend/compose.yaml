services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ucts_zone
      POSTGRES_USER: ucts
      POSTGRES_PASSWORD: ucts_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ucts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucts -d ucts_zone"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ucts_postgres_data:
