[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ucts-api"
version = "0.1.0"
description = "API de certificados UCTS con arquitectura hexagonal"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "boto3>=1.38,<2", "reportlab>=4.3,<5"
]
[tool.poetry]
packages = [{ include = "ucts", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
httpx = ">=0.28,<1"
ruff = ">=0.11,<1"
[project.scripts]
ucts = "ucts.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
